services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["mongo-data:/data/db"]
  mongo-init:
    image: mongo:8
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"
    command: ["mongosh", "--host", "mongo:27017", "--eval", "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
  chrome:
    image: browserless/chrome:latest
    environment: ["CONCURRENT=2", "TIMEOUT=30000"]
    ports: ["3001:3000"]
  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      chrome: { condition: service_started }
volumes:
  mongo-data:
